[package]
name = "spp-bench"
version = "0.1.0"
edition = "2021"
description = "SPP Measurement Harness - Phase 2"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
csv = "1.3"
rand = "0.8"
rand_chacha = "0.3"
libc = "0.2"
nix = { version = "0.27", features = ["sched"] }
tempfile = "3.0"
spp = { path = ".." }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1