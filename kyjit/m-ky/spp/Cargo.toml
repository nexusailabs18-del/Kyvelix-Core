[package]
name = "spp"
version = "0.1.0"
edition = "2021"
description = "Speculative Polyhedral Parallelization — Layer 1: Dependence Engine"

[dependencies]
m0 = { path = "../m0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rayon = "1.10"
petgraph = "0.6"
hashbrown = "0.14"
indexmap = "2.0"
bitvec = "1.0"
rand = "0.8"
rand_chacha = "0.3"
bincode = "1.3"
sha2 = "0.10"
raw-cpuid = "11"
libc = "0.2"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1

[dev-dependencies]
proptest = "1.11.0"
