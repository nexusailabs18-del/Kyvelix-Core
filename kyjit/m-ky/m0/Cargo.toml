[package]
name = "m0"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "m0-decide"
path = "src/main.rs"

[[bin]]
name = "m0-check"
path = "src/checker/main.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
num_cpus = "1.16"
dirs = "5.0"
toml = "0.8"
rayon = "1.8"
[[bin]]
name = "m0-batch"
path = "src/bin/m0-batch.rs"

[[bin]]
name = "m0-compile"
path = "src/bin/m0-compile.rs"

[[bin]]
name = "m0-batch-bin"
path = "src/bin/m0-batch-bin.rs"

[[bin]]
name = "m0-parallel"
path = "src/bin/m0-parallel.rs"

[[bin]]
name = "m0-stream"
path = "src/bin/m0-stream.rs"

[[bin]]
name = "m0-pack"
path = "src/bin/m0-pack.rs"

[[bin]]
name = "m0-packed"
path = "src/bin/m0-packed.rs"

[[bin]]
name = "m0-arena"
path = "src/bin/m0-arena.rs"

[[bin]]
name = "m1-decide"
path = "src/bin/m1-decide.rs"

[[bin]]
name = "m1-distance"
path = "src/bin/m1-distance.rs"

[[bin]]
name = "debug_p004"
path = "src/bin/debug_p004.rs"

[profile.release]
overflow-checks = true
