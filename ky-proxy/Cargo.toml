[package]
name = "ky-proxy"
version = "0.1.0"
edition = "2021"
description = "AI-enhanced proxy pool generator for realistic scraping"
authors = ["Kumar"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
socks5-rs = "2.0"
httparse = "1.8"
http = "1.0"
dashmap = "5.5"
parking_lot = "0.12"
crossbeam = "0.8"
rand = "0.8"
uuid = { version = "1.6", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
socket2 = { version = "0.5", features = ["all"] }
ipnet = "2.9"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rcgen = "0.13"

# TLS for Akamai bypass
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"

[dev-dependencies]
criterion = "0.5"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# For self-signed cert generation
