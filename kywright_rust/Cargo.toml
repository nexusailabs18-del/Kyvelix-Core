[package]
name = "kywright_filter"
version = "0.1.0"
edition = "2021"

[lib]
name = "kywright_filter"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.22"
regex = "1.10"
once_cell = "1.19"
adblock = { git = "https://github.com/brave/adblock-rust", rev = "03e12a2", default-features = false, features = ["full-regex-handling", "embedded-domain-resolver"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
